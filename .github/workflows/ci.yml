name: CI

on:
  push:
    branches: [ "main", "sprint-2/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Compilação e Testes Android (Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão de execução no gradlew
        run: chmod +x compose/gradlew

      - name: Instalar libs graficas para Compose Desktop Test
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1

      - name: Qualidade (ktlint e detekt)
        working-directory: compose
        run: ./gradlew :shared:ktlintCheck :shared:detektCommonMainSourceSet :shared:detektCommonTestSourceSet :shared:detektDesktopTestSourceSet --stacktrace

      - name: Testes compartilhados e de interface (ViewModels + Compose UI)
        working-directory: compose
        run: ./gradlew :shared:desktopTest :shared:testAndroidHostTest --stacktrace

      - name: Compilar APK Debug do Android
        working-directory: compose
        run: ./gradlew :androidApp:assembleDebug --stacktrace

  build-backend:
    name: Compilação Backend (Ktor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão de execução no gradlew
        run: chmod +x backend/gradlew

      - name: Compilar Backend
        working-directory: backend
        run: ./gradlew assemble --stacktrace

      - name: Testes backend (unitarios, gRPC, rotas e Konsist)
        working-directory: backend
        run: ./gradlew test --tests "*ArquiteturaTest" --tests "*RegrasLinkTest" --tests "*ExtratorDeMetadadosGrpcTest" --tests "*LinkRoutesTest" --stacktrace

  build-protos-go:
    name: Contrato Protobuf e Servico Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/extrator-go/go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Instalar plugins Go do Protobuf
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint e stubs Protobuf
        working-directory: protos
        run: buf lint && buf generate
      - name: Testar e compilar servico Go
        working-directory: services/extrator-go
        run: go test -v ./... && go build ./...
