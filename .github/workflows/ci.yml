name: CI

on:
  push:
    branches: [ "main", "sprint-2/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Compilação e Testes Android (Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão de execução no gradlew
        run: chmod +x compose/gradlew

      - name: Instalar libs graficas para Compose Desktop Test
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1

      - name: Qualidade (ktlint e detekt)
        working-directory: compose
        run: ./gradlew :shared:ktlintCheck :shared:detektCommonMainSourceSet :shared:detektCommonTestSourceSet :shared:detektDesktopTestSourceSet --stacktrace

      - name: Testes compartilhados e de interface (ViewModels + Compose UI)
        working-directory: compose
        run: ./gradlew :shared:desktopTest :shared:testAndroidHostTest --stacktrace

      - name: Compilar APK Debug do Android
        working-directory: compose
        run: ./gradlew :androidApp:assembleDebug --stacktrace

  build-backend:
    name: Compilação Backend (Ktor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão de execução no gradlew
        run: chmod +x backend/gradlew

      - name: Compilar Backend
        working-directory: backend
        run: ./gradlew assemble --stacktrace
