name: Migrate Database (Neon)
on: [workflow_dispatch]
jobs:
  flyway-migrate:
    name: Aplicar migrations Flyway no Neon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Executar Flyway Migrate e Info
        working-directory: backend
        env:
          FLYWAY_URL: ${{ secrets.NEON_JDBC_URL }}
          FLYWAY_USER: ${{ secrets.NEON_USER }}
          FLYWAY_PASSWORD: ${{ secrets.NEON_PASSWORD }}
        run: chmod +x gradlew && ./gradlew flywayMigrate flywayInfo --console=plain
