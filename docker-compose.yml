services:
  postgres:
    image: postgres:17
    container_name: postgres-linksaver
    restart: unless-stopped
    environment:
      POSTGRES_DB: linksaver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
