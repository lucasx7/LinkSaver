services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: linksaver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linksaver"]
      interval: 5s
      timeout: 3s
      retries: 10
  extrator:
    build: { context: ., dockerfile: services/extrator-go/Dockerfile }
    ports: ["50051:50051"]
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8080:8080"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: linksaver
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      EXTRATOR_GRPC_HOST: extrator
      EXTRATOR_GRPC_PORT: "50051"
    depends_on:
      postgres: { condition: service_healthy }
      extrator: { condition: service_healthy }
volumes:
  postgres_data:
